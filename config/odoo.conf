[options]
addons_path = /mnt/kilnworks,/mnt/oca/server-ux,/mnt/oca/purchase-workflow,/mnt/oca/sale-workflow,/mnt/oca/queue,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; Demo only. Change before exposing the instance.
admin_passwd = kilnworks-local
list_db = True
; Serve only the demo database; test databases come and go next to it.
dbfilter = ^kilnworks$
; queue_job needs to be loaded server-wide and needs worker processes for its job runner.
server_wide_modules = base,web,queue_job
workers = 2
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200
[queue_job]
channels = root:2,root.kw_shopify:1,root.kw_webhook:1
