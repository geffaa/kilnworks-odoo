# Kilnworks on Odoo — local stack. Synthetic demo data only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 10

  shopify-mock:
    image: python:3.12-alpine
    command: ["python", "-u", "/mocks/shopify_mock.py"]
    volumes:
      - ./tools/mocks:/mocks:ro
    environment:
      MOCK_THROTTLE_EVERY: "${MOCK_THROTTLE_EVERY:-0}"

  odoo:
    build: .
    image: kilnworks-odoo:18.0
    depends_on:
      db:
        condition: service_healthy
      shopify-mock:
        condition: service_started
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/kilnworks
      - ./oca:/mnt/oca:ro
      - odoo-data:/var/lib/odoo

volumes:
  db-data:
  odoo-data:
