name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    container: odoo:18.0
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: odoo, POSTGRES_PASSWORD: odoo, POSTGRES_DB: postgres }
        options: >-
          --health-cmd "pg_isready -U odoo" --health-interval 5s --health-retries 10
    strategy:
      matrix:
        module: [kw_demo]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Test ${{ matrix.module }}
        run: |
          odoo --db_host db --db_user odoo --db_password odoo -d ci \
            --addons-path "$GITHUB_WORKSPACE/addons,$GITHUB_WORKSPACE/oca/server-ux,$GITHUB_WORKSPACE/oca/purchase-workflow,$GITHUB_WORKSPACE/oca/sale-workflow,$GITHUB_WORKSPACE/oca/queue,/usr/lib/python3/dist-packages/odoo/addons" \
            -i ${{ matrix.module }} --test-tags=/${{ matrix.module }} --test-enable --stop-after-init --without-demo=all --log-level=test 2>&1 | tee test.log
          ! grep -E "(ERROR|FAIL|Traceback)" test.log
