name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: pre-commit/action@v3.0.1

  test:
    # Same image and Makefile as local runs: Odoo 18 + OCA test helper + headless Chromium for tours.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [kw_ops, kw_approval, kw_shopify, payment_midtrans, kw_reports, kw_rest_api, kw_ops_dashboard, kw_demo]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Build image
        run: docker compose build odoo
      - name: Test ${{ matrix.module }}
        run: |
          make test MOD=${{ matrix.module }} 2>&1 | tee test.log
          grep -q "0 failed, 0 error(s) of [1-9][0-9]* tests" test.log
          ! grep -E " CRITICAL |skipped .*Failed to detect chrome" test.log
