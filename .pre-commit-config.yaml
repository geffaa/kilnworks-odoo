exclude: ^(oca/|mockups/)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/OCA/pylint-odoo
    rev: v9.3.3
    hooks:
      - id: pylint_odoo
        args: [--rcfile=.pylintrc]
        files: ^addons/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-xml
      - id: end-of-file-fixer
      - id: trailing-whitespace
